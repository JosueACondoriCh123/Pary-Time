[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n-de-1"
version = "0.1.0"
description = "Consejo N-de-1: experimentos aleatorizados de arranque, en la propia compu"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "openai>=1.40",
  "numpy>=1.26",
  "scipy>=1.13",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.22"]
packaging = ["pyinstaller>=6"]     # solo para construir el sidecar (packaging/sidecar.spec)

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "windows: toca ventanas reales de Windows (se salta fuera de win32)",
  "live: llama a Ollama de verdad (NDE1_LIVE_TESTS=1)",
]

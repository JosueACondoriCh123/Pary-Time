# Frente 0: copy to .github/workflows/frente-a.yml when integrating A.
# This is a candidate build. Real user data and 48 h evidence stay local.
name: Frente A
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frente-a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -e ".[dev,packaging]"
      - if: runner.os != 'Windows'
        run: python scripts/ci_a.py --out build/ci-a
      - if: runner.os == 'Windows'
        run: python scripts/ci_a.py --out build/ci-a --build-sidecar
      - uses: actions/upload-artifact@v7
        with:
          name: frente-a-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/ci-a/ci-report.json
            build/ci-a/bundle-manifest.json
            build/ci-a/SHA256SUMS.txt
            build/ci-a/nde1-core-windows-x64.zip
